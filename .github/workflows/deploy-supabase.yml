# Автодеплой бэкенда: миграции БД + Edge Functions при push в main.
# Секрет: SUPABASE_ACCESS_TOKEN (персональный токен Supabase).
# Секреты функций (токен бота и т.д.) хранятся в самом Supabase: `supabase secrets set`.
name: Deploy supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/scripts/**'
      - 'supabase/tests/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

env:
  PROJECT_REF: ayvhxjbhfypzixnuwshy
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: DB tests (PGlite)
        working-directory: supabase/tests
        run: npm ci && npm test

      - name: Apply migrations
        run: node supabase/scripts/migrate.mjs

      - name: Deploy Edge Functions
        run: npx --yes supabase@3.1.0 functions deploy --remote="$PROJECT_REF" --use-api --yes
